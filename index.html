<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="title-bar">
      <h1 class="game-title">TETRIS</h1>
      <label class="theme-toggle">
        <span class="icon">🌙</span>
        <span class="switch">
          <input type="checkbox" id="theme-toggle" aria-label="Cambiar entre modo claro y oscuro" />
          <span class="slider"></span>
        </span>
        <span class="icon">☀️</span>
      </label>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>
        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">-</span>
        </div>

        <div class="panel-section" id="challenge-panel" hidden>
          <span class="label">OBJETIVO</span>
          <span class="value small" id="challenge-goal">-</span>
          <span class="label">TIEMPO</span>
          <span class="value small" id="challenge-time">-</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
        <button id="menu-btn" class="secondary-btn">Elegir modo</button>
      </div>
    </div>

    <div id="menu-overlay" class="overlay">
      <div class="overlay-box menu-box">
        <p class="menu-title">MODO DE JUEGO</p>
        <div class="mode-list">
          <button class="mode-btn" data-challenge="">
            <span class="mode-name">Modo libre</span>
            <span class="mode-desc">Juega sin objetivos, solo puntuación</span>
          </button>
          <button class="mode-btn" data-challenge="lines40">
            <span class="mode-name">Contrarreloj</span>
            <span class="mode-desc">Limpia 40 líneas en 2 minutos</span>
          </button>
          <button class="mode-btn" data-challenge="garbage">
            <span class="mode-name">Supervivencia</span>
            <span class="mode-desc">Sobrevive con basura subiendo cada 10s</span>
          </button>
          <button class="mode-btn" data-challenge="fixed">
            <span class="mode-name">Bloques fijos</span>
            <span class="mode-desc">Tablero con obstáculos pre-colocados</span>
          </button>
          <button class="mode-btn" data-challenge="invisible">
            <span class="mode-name">Piezas invisibles</span>
            <span class="mode-desc">Las piezas desaparecen al tocar el suelo</span>
          </button>
          <button class="mode-btn" data-challenge="reverse">
            <span class="mode-name">Rotación inversa</span>
            <span class="mode-desc">Limpia 30 líneas; la rotación se invierte desde el nivel 2</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
